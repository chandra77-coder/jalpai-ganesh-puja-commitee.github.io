<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jalpai Ganesh Puja Committee | জালপাই গণেশ পূজা কমিটি</title>
<meta name="description" content="Official website of Jalpai Ganesh Puja Committee">
<meta name="robots" content="index,follow,max-image-preview:large">
<meta name="theme-color" content="#c98d18">
<link rel="canonical" href="https://jalpaiganeshpujacommittee.in/">
<style>
html,body{margin:0;height:100%;background:#1A0A00;color:#FFF8E7;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}.loader{min-height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}.box{max-width:560px;padding:32px;border:1px solid #c98d18;border-radius:20px;background:#281305;box-shadow:0 12px 40px #0008}.om{font-size:48px;color:#f4bd45}.brand{font-size:24px;font-weight:700;margin:8px}.muted{color:#e8c99a}.error{display:none;color:#ffb4a2;margin-top:16px}
</style>
</head>
<body>
<div class="loader"><div class="box"><div class="om">ॐ</div><div class="brand">Jalpai Ganesh Puja Committee</div><div class="muted">Loading premium website design...</div><div id="err" class="error"></div></div></div>
<script>
(async()=>{
  const files=[0,1,2,3,4,5,6,7,8].map(i=>'premium_parts/jgpc_premium_v2.part'+i+'.txt');
  try{
    if(!('DecompressionStream' in window)) throw new Error('This browser does not support the premium loader. Please update Chrome/Edge/Firefox/Safari.');
    const parts=await Promise.all(files.map(async f=>{const r=await fetch(f+'?v=4',{cache:'no-store'});if(!r.ok)throw new Error('Missing '+f);return(await r.text()).trim();}));
    const bin=atob(parts.join(''));
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    let html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    const correctMapLink='https://maps.app.goo.gl/25JJh4d6gbogQjNV7';
    html=html.replace(/https:\/\/maps\.app\.goo\.gl\/[A-Za-z0-9]+/g,correctMapLink);
    html=html.replace(/Official FacebookGoogle Map/g,'Official Facebook · Google Map');
    html=html.replace(/<div class=["']jgpc-member-example["'][\s\S]*?<\/div>/gi,'');
    html=html.replace(/Enter your Name and 4-digit Member Code to view your ID card/gi,'Put your verified member code');
    html=html.replace(/Enter your member code to view your ID card\.?/gi,'Put your verified member code');
    html=html.replace(/placeholder=["'][^"']*(Chandra|Example|e\.g\.)[^"']*["']/gi,'placeholder="Put your verified member code"');
    // Reactivate the countdown for Ganesh Chaturthi 2027 (4 September, India).
    html=html.replace(/2026-09-14/g,'2027-09-04');
    html=html.replace(/September\s+14,?\s+2026/gi,'September 4, 2027');
    html=html.replace(/Sep\s+14,?\s+2026/gi,'Sep 4, 2027');
    html=html.replace(/new Date\(\s*2026\s*,\s*8\s*,\s*14\s*\)/g,'new Date(2027, 8, 4)');
    if(!html.includes('JGPC 2026')||!html.includes('ULTRA PREMIUM DESIGN SYSTEM'))throw new Error('Premium file verification failed.');
    document.open();document.write(html);document.close();
  }catch(e){const el=document.getElementById('err');el.style.display='block';el.textContent='Could not load premium website: '+e.message;console.error(e);}
})();
</script>
</body>
</html>
